trigger: none

resources:
  repositories:
  - repository: self
  - repository: templates
    type: git
    name: platform-gitops/platform-pipeline-templates
    ref: refs/heads/main

variables:
- group: pipeline-shared-secrets

stages:
- template: pipelines/nodejs-full-nwl.yml@templates
  parameters:
    # gitops repo แยกตาม env — branch develop→DEV, uat→UAT, main→PROD (set-branch-vars-nwl)
    gitopsRepoDEV: 'gitops-dev-nwl'
    gitopsRepoUAT: 'gitops-uat-nwl'
    gitopsRepoPROD: 'gitops-centralize'
    # ทั้ง 3 env ใช้ Harbor ตัวเดียวกัน (ยืนยันจาก values-*.yaml ทั้ง 3 repo)
    # ต้อง set containerRegistry เอง — default ของ template คือ harbor.localmartthailand.com (สาย retail)
    containerRegistry: 'harbor.testdays.me:8980'
    containerRegistryUAT: 'harbor.testdays.me:8980'
    argocdServer: 'argocd.localmartthailand.com'   # ไม่ถูกใช้ — entrypoint ตั้ง skipArgocdSync: true
    enforceTests: true   # unit test เป็น gate จริง (verified 2026-07-06: 523/523 ผ่าน)
