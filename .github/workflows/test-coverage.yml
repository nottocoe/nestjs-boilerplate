name: Run Jest Coverage

on:
  pull_request:
    branches: [main, uat, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          npx jest --coverage --ci \
            --coverageReporters=text-summary --coverageReporters=lcov \
            | tee coverage-summary-txt-raw
        env:
          TZ: 'UTC'

      - name: Upload coverage summary to GitHub Actions summary
        if: always()
        run: |
          if [ -f coverage-summary-txt-raw ]; then
            sed -n '/Statements/,/Lines/p' coverage-summary-txt-raw > coverage-summary.txt
            echo "### 🧪 Jest Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          COVERAGE=$(cat coverage-summary.txt 2>/dev/null || echo "n/a")
          if [ "$JOB_STATUS" = "success" ]; then COLOR=3066993; else COLOR=15158332; fi
          JSON_PAYLOAD=$(jq -n \
          --arg title "🧪 Jest Coverage Report" \
          --arg project "nwl-boilerplate" \
          --arg branch "${{ github.ref_name }}" \
          --arg status "$JOB_STATUS" \
          --argjson color "$COLOR" \
          --arg coverage "$COVERAGE" \
          --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          '{
            embeds: [{
              title: $title,
              color: $color,
              fields: [
                { name: "Project", value: $project, inline: true },
                { name: "Branch", value: $branch, inline: true },
                { name: "Status", value: $status, inline: true },
                { name: "Coverage Summary", value: ("```\n" + $coverage + "\n```") }
              ],
              url: $url
            }]
          }')

          curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
