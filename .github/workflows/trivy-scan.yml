name: Trivy Security Scan

on:
  pull_request:
    branches: [main, uat, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
  TRIVY_SKIP_VERSION_CHECK: 'true'

jobs:
  trivy-fs:
    name: Filesystem & Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy (dependencies + Dockerfile misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          output: 'trivy-fs-report.txt'

      - name: Publish report to log and job summary
        if: always()
        run: |
          if [ -f trivy-fs-report.txt ]; then
            cat trivy-fs-report.txt
            echo "### 🔒 Trivy Filesystem/Config Scan" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-fs-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  trivy-image:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: nwl-boilerplate:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy on built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'nwl-boilerplate:pr-${{ github.event.pull_request.number }}'
          scanners: 'vuln'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          output: 'trivy-image-report.txt'

      - name: Publish report to log and job summary
        if: always()
        run: |
          if [ -f trivy-image-report.txt ]; then
            cat trivy-image-report.txt
            echo "### 🐳 Trivy Container Image Scan" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-image-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
